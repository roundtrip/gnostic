syntax = "proto3";

package tests.floattags.message.v1;

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";

option go_package = "github.com/google/gnostic/cmd/protoc-gen-openapi/examples/tests/floattags/message/v1;message";

service Messaging {
  rpc GetMessage(GetMessageRequest) returns (Message) {
    option (google.api.http) = {
      get: "/v1/messages/{message_id}"
    };
  }
}

message GetMessageRequest {
  string message_id = 1;
}

message Message {
  string message_id = 1;
  double score = 2 [
    (openapi.v3.property) = {
      minimum: 0;
      maximum: 100;
    }
  ];
}
