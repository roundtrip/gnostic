syntax = "proto3";

package tests.idempotency;

option go_package = "github.com/google/gnostic/cmd/protoc-gen-openapi/examples/tests/idempotency";

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";
import "tests/idempotency/options.proto";

option (openapi.v3.document) = {
  components: {
    parameters: {
      additional_properties: {
        name: "CustomIdempotencyKey"
        value: {
          parameter: {
            name: "Idempotency-Key"
            in: "header"
            description: "A manually documented idempotency key."
            schema: {schema: {type: "string"}}
          }
        }
      }
    }
    responses: {
      additional_properties: {
        name: "AcceptedMessage"
        value: {
          response: {
            description: "A reusable accepted response."
            content: {
              additional_properties: {
                name: "application/json"
                value: {schema: {schema: {type: "string"}}}
              }
            }
          }
        }
      }
    }
  }
};

message AnnotatedMessage {
  string name = 1;
}

service AnnotatedMessaging {
  rpc Create(AnnotatedMessage) returns (AnnotatedMessage) {
    option (tests.idempotency.policy) = POLICY_OPTIONAL;
    option (google.api.http) = {
      post: "/v1/annotated"
      body: "*"
    };
    option (openapi.v3.operation) = {
      parameters: {
        reference: {_ref: "#/components/parameters/CustomIdempotencyKey"}
      }
      responses: {
        response_or_reference: {
          name: "201"
          value: {
            response: {
              description: "A manually documented created response."
              headers: {
                additional_properties: {
                  name: "idempotency-key"
                  value: {header: {description: "A manually documented response header."}}
                }
              }
            }
          }
        }
        response_or_reference: {
          name: "202"
          value: {reference: {_ref: "#/components/responses/AcceptedMessage"}}
        }
      }
    };
  }
}
