syntax = "proto3";

package tests.idempotency;

option go_package = "github.com/google/gnostic/cmd/protoc-gen-openapi/examples/tests/idempotency";

import "google/api/annotations.proto";
import "tests/idempotency/options.proto";

message Message {
  string name = 1;
}

service Messaging {
  rpc Create(Message) returns (Message) {
    option (tests.idempotency.policy) = POLICY_OPTIONAL;
    option (google.api.http) = {
      post: "/v1/messages"
      body: "*"
      additional_bindings: {
        post: "/v1/other-messages"
        body: "*"
      }
    };
  }

  rpc Replace(Message) returns (Message) {
    option (tests.idempotency.policy) = POLICY_OPTIONAL;
    option (google.api.http) = {
      put: "/v1/messages/{name}"
      body: "*"
    };
  }

  rpc Unsupported(Message) returns (Message) {
    option (tests.idempotency.policy) = POLICY_UNSUPPORTED;
    option (google.api.http) = {
      post: "/v1/unsupported"
      body: "*"
    };
  }

  rpc Get(Message) returns (Message) {
    option (google.api.http) = {get: "/v1/messages/{name}"};
  }
}
