syntax = "proto3";

package tests.idempotency;

option go_package = "github.com/google/gnostic/cmd/protoc-gen-openapi/examples/tests/idempotency";

import "google/protobuf/descriptor.proto";

enum Policy {
  POLICY_UNKNOWN = 0;
  POLICY_UNSUPPORTED = 1;
  POLICY_OPTIONAL = 2;
  POLICY_FUTURE = 3;
}

enum IncompatiblePolicy {
  INCOMPATIBLE_POLICY_UNKNOWN = 0;
  INCOMPATIBLE_POLICY_OPTIONAL = 1;
}

extend google.protobuf.MethodOptions {
  Policy policy = 51001;
  string wrong_policy_type = 51002;
  IncompatiblePolicy incompatible_policy = 51004;
}

extend google.protobuf.FileOptions {
  Policy wrong_policy_extendee = 51003;
}
