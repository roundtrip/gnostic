syntax = "proto3";

package tests.mcp;

option go_package = "github.com/google/gnostic/cmd/protoc-gen-openapi/examples/tests/mcp";

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";
import "tests/mcp/options.proto";

message ConflictingMessage {
  string name = 1;
}

service Conflicting {
  rpc Hidden(ConflictingMessage) returns (ConflictingMessage) {
    option (tests.mcp.exclude_from_mcp) = true;
    option (google.api.http) = {
      post: "/v1/conflicting"
      body: "*"
    };
    option (openapi.v3.operation) = {
      operation_id: "hidden_conflicting"
      specification_extension: {
        name: "x-mcp-tool"
        value: {yaml: "name: hidden_conflicting\nreadOnly: false\n"}
      }
    };
  }
}
