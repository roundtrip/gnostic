syntax = "proto3";

package tests.mcp;

option go_package = "github.com/google/gnostic/cmd/protoc-gen-openapi/examples/tests/mcp";

import "google/api/annotations.proto";
import "openapiv3/annotations.proto";
import "tests/mcp/options.proto";

message Message {
  string name = 1;
}

service Messaging {
  rpc List(Message) returns (Message) {
    option (google.api.http) = {get: "/v1/messages"};
    option (openapi.v3.operation) = {operation_id: "list_messages"};
  }

  rpc Create(Message) returns (Message) {
    option (google.api.http) = {
      post: "/v1/messages"
      body: "*"
      additional_bindings: {
        post: "/v1/other-messages"
        body: "*"
      }
    };
    option (openapi.v3.operation) = {operation_id: "create_message"};
  }

  rpc Delete(Message) returns (Message) {
    option (tests.mcp.exclude_from_mcp) = false;
    option (google.api.http) = {delete: "/v1/messages/{name}"};
    option (openapi.v3.operation) = {operation_id: "delete_message"};
  }

  rpc Hidden(Message) returns (Message) {
    option (tests.mcp.exclude_from_mcp) = true;
    option (google.api.http) = {
      post: "/v1/hidden"
      body: "*"
    };
    option (openapi.v3.operation) = {operation_id: "hidden_message"};
  }

  rpc Annotated(Message) returns (Message) {
    option (google.api.http) = {
      post: "/v1/annotated"
      body: "*"
    };
    option (openapi.v3.operation) = {
      operation_id: "annotated_message"
      specification_extension: {
        name: "x-mcp-tool"
        value: {yaml: "name: custom_tool\nreadOnly: true\n"}
      }
    };
  }
}
